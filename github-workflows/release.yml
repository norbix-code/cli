name: Release to npm

# Publishes when you push a version tag:
#   npm version patch   (or minor / major — updates package.json + creates the tag)
#   git push --follow-tags
#
# Needs an npm automation token stored as the NPM_TOKEN repository secret
# (npmjs.com → Access Tokens → Generate New Token → Automation).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ./bin/run.js --help
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
